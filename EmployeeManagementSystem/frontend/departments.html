<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments - Employee Management System</title>
    <meta name="description" content="Manage corporate departments and staffing allocations.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="app-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo-icon">EMS</div>
                <div>
                    <div class="sidebar-brand-name">ApexEMS</div>
                    <div class="sidebar-brand-sub">Management Suite</div>
                </div>
            </div>

            <nav class="sidebar-menu">
                <div class="sidebar-section-title">Navigation</div>
                <a href="dashboard.html" class="sidebar-link">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    Dashboard
                </a>
                <a href="employees.html" class="sidebar-link">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    Employees
                </a>
                <a href="add-employee.html" class="sidebar-link">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                    Add Employee
                </a>
                <a href="departments.html" class="sidebar-link active">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                    Departments
                </a>
                <a href="reports.html" class="sidebar-link">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Reports
                </a>

                <div class="sidebar-section-title" style="margin-top: 1rem;">System</div>
                <a href="settings.html" class="sidebar-link">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Settings
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile-widget">
                    <div class="avatar" id="sidebar-avatar">AD</div>
                    <div class="user-profile-info">
                        <span class="user-profile-name" id="sidebar-username">Admin</span>
                        <span class="user-role-badge" id="sidebar-role">Admin</span>
                    </div>
                </div>
                <button class="btn-sidebar-logout" onclick="logout()" title="Logout">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-wrapper">
            <header class="top-header">
                <div class="header-left">
                    <button class="mobile-nav-toggle" aria-label="Toggle navigation">
                        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <h1 class="page-title">Department Management</h1>
                </div>
                <div class="header-right">
                    <button class="btn btn-primary" onclick="openAddDeptModal()">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Add Department
                    </button>
                </div>
            </header>

            <div class="content-body">
                <div class="table-card">
                    <div class="table-header-bar">
                        <h2 class="table-title">Configured Business Units</h2>
                    </div>
                    <div class="table-responsive">
                        <table class="custom-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Department Name</th>
                                    <th>Description</th>
                                    <th>Assigned Employees</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="departments-table-body">
                                <tr><td colspan="5" class="table-loading-overlay"><div class="spinner spinner-dark"></div>Loading departments...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Department Modal -->
    <div class="modal-overlay" id="add-dept-modal">
        <div class="modal-content sm">
            <div class="modal-header">
                <h3 class="modal-title">Add Department</h3>
                <button class="modal-close" onclick="closeAddDeptModal()">&times;</button>
            </div>
            <form onsubmit="submitAddDepartment(event)">
                <div class="modal-body">
                    <div class="form-group" style="margin-bottom: 1.25rem;">
                        <label for="add-dept-name" class="form-label">Department Name <span style="color:var(--danger);">*</span></label>
                        <input type="text" id="add-dept-name" class="form-control" placeholder="e.g. Research & Development" required>
                    </div>
                    <div class="form-group">
                        <label for="add-dept-desc" class="form-label">Description</label>
                        <textarea id="add-dept-desc" class="form-control" rows="3" placeholder="Brief description of the department's mandate..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeAddDeptModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Department</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Department Modal -->
    <div class="modal-overlay" id="edit-dept-modal">
        <div class="modal-content sm">
            <div class="modal-header">
                <h3 class="modal-title">Edit Department</h3>
                <button class="modal-close" onclick="closeEditDeptModal()">&times;</button>
            </div>
            <form onsubmit="submitEditDepartment(event)">
                <div class="modal-body">
                    <div class="form-group" style="margin-bottom: 1.25rem;">
                        <label for="edit-dept-name" class="form-label">Department Name <span style="color:var(--danger);">*</span></label>
                        <input type="text" id="edit-dept-name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-dept-desc" class="form-label">Description</label>
                        <textarea id="edit-dept-desc" class="form-control" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeEditDeptModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/departments.js"></script>
    <script>
        requireAuth();
        document.addEventListener("DOMContentLoaded", () => {
            loadDepartments();
        });
    </script>
</body>
</html>
