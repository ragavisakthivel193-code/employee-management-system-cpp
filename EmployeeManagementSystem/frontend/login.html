<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Employee Management System</title>
    <meta name="description" content="Secure administrative login for Employee Management System.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-brand">
            <div class="login-logo">
                <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
            </div>
            <h1>Employee Management System</h1>
            <p>Welcome Back! Please enter your credentials.</p>
        </div>

        <!-- Alert Error Message -->
        <div id="login-error-alert" style="display:none; margin-bottom:1.25rem; padding:0.85rem 1rem; border-radius:var(--radius-md); background-color:var(--danger-bg); border:1px solid var(--danger-border); color:var(--danger); font-size:0.875rem; font-weight:600; display:none; align-items:center; gap:0.5rem;">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span id="login-error-text">Invalid username or password</span>
        </div>

        <form id="login-form">
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label for="username" class="form-label">Username / Email</label>
                <input type="text" id="username" class="form-control" placeholder="admin or admin@company.com" required autocomplete="username">
            </div>

            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label for="password" class="form-label">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" style="padding-right: 2.75rem;">
                    <button type="button" class="password-toggle-btn" id="btn-toggle-password" title="Toggle password visibility">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </button>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.85rem;">
                <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; color: var(--text-secondary);">
                    <input type="checkbox" id="remember-me" checked> Remember me
                </label>
                <a href="javascript:void(0)" onclick="alert('For security reasons, password resets must be requested via System Administrator at admin@company.com.')" style="color: var(--primary); font-weight: 600;">Forgot Password?</a>
            </div>

            <button type="submit" id="btn-login-submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem;">
                LOGIN
            </button>
        </form>

        <!-- Demo Credentials Helper -->
        <div class="login-demo-box">
            <div class="login-demo-title">Quick Test Credentials</div>
            <div class="demo-credentials-grid">
                <button type="button" class="btn-demo-badge" onclick="fillCredentials('admin', 'Admin@123')">
                    👑 <strong>Admin</strong><br>
                    <span style="color:var(--text-muted); font-size:0.7rem;">admin / Admin@123</span>
                </button>
                <button type="button" class="btn-demo-badge" onclick="fillCredentials('hr_priya', 'Hr@123')">
                    👤 <strong>HR User</strong><br>
                    <span style="color:var(--text-muted); font-size:0.7rem;">hr_priya / Hr@123</span>
                </button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Check if already authenticated
        requireGuest();

        setupPasswordToggle("#password", "#btn-toggle-password");

        function fillCredentials(u, p) {
            document.getElementById("username").value = u;
            document.getElementById("password").value = p;
            document.getElementById("login-error-alert").style.display = "none";
        }

        // Check if expired message is passed in URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("expired")) {
            showToast("Your session has expired. Please log in again.", "warning");
        }

        const loginForm = document.getElementById("login-form");
        const errorAlert = document.getElementById("login-error-alert");
        const errorText = document.getElementById("login-error-text");
        const submitBtn = document.getElementById("btn-login-submit");

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorAlert.style.display = "none";

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            if (!username || !password) {
                errorText.textContent = "Please provide both username/email and password.";
                errorAlert.style.display = "flex";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="spinner"></span> Logging in...`;

            try {
                const res = await api.post("/api/auth/login", { username, password });
                if (!res.success) {
                    errorText.textContent = res.message || "Invalid credentials.";
                    errorAlert.style.display = "flex";
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = "LOGIN";
                    return;
                }

                // Store session
                api.setSession(res.data.token, res.data.user);
                showToast("Login successful! Redirecting...", "success");

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 600);

            } catch (err) {
                errorText.textContent = "Failed to connect to the backend server. Please verify the server is running on port 8088.";
                errorAlert.style.display = "flex";
                submitBtn.disabled = false;
                submitBtn.innerHTML = "LOGIN";
            }
        });
    </script>
</body>
</html>
